services:
  - type: web
    name: 2026-summer-project
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: MICROCHECK_SECRET_KEY
        generateValue: true
      - key: MICROCHECK_DB_PATH
        value: /var/data/microcheck.db
    disk:
      name: microcheck-data
      mountPath: /var/data
      sizeGB: 1