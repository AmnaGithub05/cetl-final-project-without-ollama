services:
  - type: web
    name: microcheck
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: MICROCHECK_SECRET_KEY
        generateValue: true
      - key: MICROCHECK_DB_PATH
        value: /var/data/microcheck.db
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.6-flash
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_MODEL
        value: claude-haiku-5-5
    disk:
      name: microcheck-data
      mountPath: /var/data
      sizeGB: 1