<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}2026 Summer Project{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
    <link rel="stylesheet" href="{{ url_for('static', filename='css/answer-key.css') }}" />
    {% block head %}{% endblock %}
  </head>
  <body>
    <div class="page-shell">
      <div class="ambient ambient-a"></div>
      <div class="ambient ambient-b"></div>
      <header class="topbar">
        <div>
          <p class="eyebrow">2026 Summer Project</p>
          <h1>{% block header_title %}Classroom response prototype{% endblock %}</h1>
        </div>
      </header>

      <main class="content-grid">{% block content %}{% endblock %}</main>
    </div>
    {% block scripts %}{% endblock %}
  </body>
</html>
